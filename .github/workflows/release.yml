name: Release

on:
  push:
    tags: ["v*"]

# Same sibling-checkout rule as ci.yml: build.zig.zon PATH-deps zig-klient and
# kubectl-traffic, both public. Zig cross-compiles all four release targets
# from Ubuntu so a tag does not spend macOS minutes; that includes libcurl,
# nghttp2, mbedTLS and zlib, which zig-klient fetches as pinned source tarballs
# and the build compiles for each target. The binaries link only libc.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - zig_target: x86_64-linux-musl
            artifact: linux-amd64
            zig_url: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
            zig_sha: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
            zig_dir: zig-x86_64-linux-0.17.0
          - zig_target: aarch64-linux-musl
            artifact: linux-arm64
            zig_url: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
            zig_sha: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
            zig_dir: zig-x86_64-linux-0.17.0
          - zig_target: x86_64-macos
            artifact: darwin-amd64
            zig_url: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
            zig_sha: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
            zig_dir: zig-x86_64-linux-0.17.0
          - zig_target: aarch64-macos
            artifact: darwin-arm64
            zig_url: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
            zig_sha: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
            zig_dir: zig-x86_64-linux-0.17.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone sibling dependencies
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")"
          git clone --depth 1 https://github.com/guanchzhou/zig-klient zig-klient
          git clone --depth 1 https://github.com/guanchzhou/kubectl-traffic kubectl-traffic

      - name: Install Zig 0.17.0
        env:
          ZIG_URL: ${{ matrix.zig_url }}
          ZIG_SHA: ${{ matrix.zig_sha }}
          ZIG_DIR: ${{ matrix.zig_dir }}
        run: |
          curl -fsSL "$ZIG_URL" -o zig.tar.xz
          echo "$ZIG_SHA  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/$ZIG_DIR" >> "$GITHUB_PATH"

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zig version
          zig build -Doptimize=ReleaseSafe -Dtarget="$ZIG_TARGET" -Dversion="v$VERSION"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          ART="c3s-${VERSION}-${ARTIFACT}"
          mkdir -p pkg
          cp zig-out/bin/c3s pkg/c3s
          cp -r zig-out/bin/skins pkg/skins
          cp LICENSE CHANGELOG.md README.md pkg/
          tar -C pkg -czf "${ART}.tar.gz" c3s skins LICENSE CHANGELOG.md README.md
          shasum -a 256 "${ART}.tar.gz" > "${ART}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c3s-${{ matrix.artifact }}
          path: |
            c3s-*.tar.gz
            c3s-*.tar.gz.sha256
          retention-days: 5

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "ERROR: No CHANGELOG.md section for $VERSION. Add one before tagging."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/c3s-*.tar.gz dist/c3s-*.tar.gz.sha256 \
            --title "$TAG_NAME" \
            --notes-file release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/c3s-*.tar.gz

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          sha() { shasum -a 256 "$1" | awk '{print $1}'; }
          SHA_DARWIN_ARM=$(sha "dist/c3s-${VER}-darwin-arm64.tar.gz")
          SHA_DARWIN_AMD=$(sha "dist/c3s-${VER}-darwin-amd64.tar.gz")
          SHA_LINUX_ARM=$(sha "dist/c3s-${VER}-linux-arm64.tar.gz")
          SHA_LINUX_AMD=$(sha "dist/c3s-${VER}-linux-amd64.tar.gz")

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/guanchzhou/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Formula
          cat > /tmp/homebrew-tap/Formula/c3s.rb << FORMULA
          class C3s < Formula
            desc "Kubernetes TUI client"
            homepage "https://github.com/guanchzhou/c3s"
            license "Apache-2.0"

            livecheck do
              url :stable
              strategy :github_latest
            end

            on_macos do
              on_arm do
                url "https://github.com/guanchzhou/c3s/releases/download/v${VER}/c3s-${VER}-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM}"
              end
              on_intel do
                url "https://github.com/guanchzhou/c3s/releases/download/v${VER}/c3s-${VER}-darwin-amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/guanchzhou/c3s/releases/download/v${VER}/c3s-${VER}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              end
              on_intel do
                url "https://github.com/guanchzhou/c3s/releases/download/v${VER}/c3s-${VER}-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD}"
              end
            end

            def install
              libexec.install "c3s", "skins"
              bin.install_symlink libexec/"c3s"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/c3s --version 2>&1")
            end
          end
          FORMULA

          cd /tmp/homebrew-tap
          git config user.email "maltsev.andrey@gmail.com"
          git config user.name "Andrey Maltsev"
          git add Formula/c3s.rb
          git commit -m "Update c3s to v${VER}"
          git push
